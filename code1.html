
<!DOCTYPE html>
<html>
<head>
    <title>My First Game</title>
    <style>
        body {
            background: #202838;
            color: white;
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        button {
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Click thing idfk</h1>
    <p id="score">Score: 0</p>
    <button onclick="addPoint()">Click me!</button>

    <script>
        let points = 0;

        function addPoint() {
            points++;
            document.getElementById("score").textContent =
                "Score: " + points;
        }
    </script>
</body>
</html>
